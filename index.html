function mark(v){var w=S.q[S.n];K[S.d.id+":"+w[0]]=v;sr(S.d,w,v==="k");bump();save();S.ses[v]++;if(v==="n")S.q.push(w);S.n++;card()}
function quiz(){var d=S.d;S.qs=sh(d.w);S.n=0;S.sc=0;S.mode="quiz";S.ai=2;S.nx=qn;qn()}
function qn(){var d=S.d;if(S.n>=S.qs.length){return $(hd()+'<div class="q"><div class="big">'+S.sc+'/'+S.qs.length+'</div><h2>'+(S.sc/S.qs.length>=.8?"เยี่ยมมาก!":"ลองทบทวนอีกครั้ง")+'</h2></div><div class="row"><button class="btn" onclick="deck('+S.i+')">กลับ</button><button class="btn y" onclick="quiz()">เล่นอีกครั้ง</button></div>')}
var w=S.qs[S.n],o=sh(sh(d.w.filter(function(x){return x!==w})).slice(0,3).concat([w]));S.cur=w;
var h=hd()+'<div class="top"><button class="ghost" onclick="deck('+S.i+')">← ออก</button><span class="mu">ข้อ '+(S.n+1)+' / '+S.qs.length+' · ถูก '+S.sc+'</span></div><div class="bar"><i style="width:'+S.n/S.qs.length*100+'%"></i></div><div class="q"><div class="mu">คำนี้แปลว่าอะไร</div><div class="w">'+w[0]+'</div></div>';
o.forEach(function(x,i){h+='<button class="opt" onclick="ans(this,'+(x===w?1:0)+')">'+x[2]+'</button>'});
$(h);spk(w[0])}
function ans(b,ok){var bs=document.querySelectorAll(".opt");bs.forEach(function(x){x.disabled=true});b.classList.add(ok?"ok":"no");
if(!ok)bs.forEach(function(x){if(x.textContent===S.cur[S.ai])x.classList.add("ok")});
if(ok)S.sc++;K[S.d.id+":"+S.cur[0]]=ok?"k":"n";sr(S.d,S.cur,ok);bump();save();setTimeout(function(){S.n++;S.nx()},ok?700:1500)}
function match(){var d=S.d,p=sh(d.w).slice(0,6),t=[];p.forEach(function(w){t.push({k:w[0],t:w[0]});t.push({k:w[0],t:w[2]})});
S.t=sh(t);S.sel=null;S.left=6;S.s=Date.now();clearInterval(T);mr();T=setInterval(function(){var e=document.getElementById("tm");if(e)e.textContent=((Date.now()-S.s)/1000).toFixed(1)+" วิ"},100)}
function mr(){var h=hd()+'<div class="top"><button class="ghost" onclick="deck('+S.i+')">← ออก</button><b id="tm">0.0 วิ</b></div><h2>แตะจับคู่ศัพท์กับคำแปล</h2><div class="tiles">';
S.t.forEach(function(x,i){h+='<button class="tile'+(x.d?" d":"")+(S.sel===i?" s":"")+'" onclick="pick('+i+')">'+x.t+'</button>'});$(h+'</div>')}
function pick(i){var a=S.t[i];if(S.sel===null){S.sel=i;return mr()}if(S.sel===i){S.sel=null;return mr()}var b=S.t[S.sel];
if(a.k===b.k){a.d=b.d=1;S.left--;S.sel=null;mr();if(!S.left){clearInterval(T);var s=((Date.now()-S.s)/1000).toFixed(1);$(hd()+'<div class="q"><div class="big">'+s+' วิ</div><h2>จับคู่ครบแล้ว!</h2></div><div class="row"><button class="btn" onclick="deck('+S.i+')">กลับ</button><button class="btn y" onclick="match()">เล่นอีกครั้ง</button></div>')}}
else{var j=S.sel;S.sel=null;mr();var ts=document.querySelectorAll(".tile");[ts[i],ts[j]].forEach(function(e){e.classList.add("x")});setTimeout(mr,450)}}
document.addEventListener("keydown",function(e){if(!document.getElementById("cd"))return;if(e.code==="Space"){e.preventDefault();flip()}if(e.key==="ArrowLeft")mark("n");if(e.key==="ArrowRight")mark("k")});
home();
</script>
</body>
</html>
